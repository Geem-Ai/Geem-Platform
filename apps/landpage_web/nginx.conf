server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare terminates TLS; keep Location headers relative so /en
    # is not rewritten to http://geem.ai/en/.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Marketing root → English (canonical / default locale)
    location = / {
        return 301 /en;
    }

    location /_astro/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
