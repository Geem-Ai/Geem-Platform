<!doctype html>
<html class="h-full" lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/webp" href="/brand/geem-avatar.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Geem — Arabic-first AI workspace" />
    <meta name="author" content="Geem" />
    <title>Geem | مساحة عمل ذكاء اصطناعي بالعربية أولاً</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('geem-theme') || 'system';
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          const isDarkMode =
            theme === 'dark' || (theme === 'system' && prefersDark);
          if (isDarkMode) document.documentElement.classList.add('dark');

          const locale = localStorage.getItem('geem-locale') === 'en' ? 'en' : 'ar';
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
          document.title =
            locale === 'en'
              ? 'Geem | Arabic-first AI workspace'
              : 'Geem | مساحة عمل ذكاء اصطناعي بالعربية أولاً';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans text-foreground bg-background flex h-full text-base antialiased">
    <div class="flex grow min-w-0" id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
