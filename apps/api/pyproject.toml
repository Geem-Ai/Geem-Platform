[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "performance: large fixtures / EXPLAIN timings; run with GEEM_USAGE_SCALE=1",
    "isolation: concurrent tenant-isolation harness (Phase 11D)",
    "load: quota/chat/usage concurrency load tests (Phase 11D)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
