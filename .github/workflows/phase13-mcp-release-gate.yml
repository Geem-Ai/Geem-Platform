name: Phase 13 MCP release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API MCP and shared provider unit contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run database-free MCP, shared provider, and topology contracts
        run: >-
          pytest -q --confcutdir=tests/unit
          tests/unit/test_agent_*.py
          tests/unit/test_agents_ai_commercial_foundation.py
          tests/unit/test_openai_compat.py
          tests/unit/test_openrouter_contracts.py
          tests/unit/test_mcp_*.py
          tests/unit/test_conversation_mcp_serialization.py
          tests/unit/test_outbound_http_policy.py
          tests/unit/test_beat_app_isolation.py
          tests/unit/test_production_compose_validator.py

  api-integration:
    name: API MCP and channel integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: geem
          POSTGRES_PASSWORD: geem
          POSTGRES_DB: geem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geem -d geem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://geem:geem@localhost:5432/geem_test
      DATABASE_URL: postgresql+psycopg://geem:geem@localhost:5432/geem_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the complete Alembic chain through the single release head
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic upgrade head
          alembic current | grep -F "0041_openwa_binding_backfill (head)"
      - name: Run MCP persistence, commercial, and WhatsApp surface contracts
        run: >-
          pytest -q
          tests/integration/test_mcp_*.py
          tests/integration/test_openwa_phase9f.py

  api-full-regression:
    name: Full API unit and integration regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: geem
          POSTGRES_PASSWORD: geem
          POSTGRES_DB: geem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geem -d geem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://geem:geem@localhost:5432/geem_test
      DATABASE_URL: postgresql+psycopg://geem:geem@localhost:5432/geem_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run the complete API unit and integration regression
        run: >-
          pytest -q
          --junitxml=phase13-api-full-regression.xml
          tests/unit
          tests/integration
      - name: Attach exact-SHA API regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase13-api-regression-${{ github.sha }}
          path: apps/api/phase13-api-full-regression.xml
          if-no-files-found: error
          retention-days: 30

  gateway-and-compose:
    name: Gateway, proxy, and Compose isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/mcp_egress_gateway/requirements.txt
      - name: Install isolated gateway test dependencies
        run: pip install -r apps/mcp_egress_gateway/requirements.txt pytest
      - name: Prepare non-secret Compose fixture environments
        run: |
          cp .env.example .env
          cp apps/workspace_web/.env.example apps/workspace_web/.env
          cp apps/dashboard_web/.env.example apps/dashboard_web/.env
          cp apps/landpage_web/.env.example apps/landpage_web/.env
      - name: Run the complete gateway and isolation suite
        env:
          PYTHONPATH: apps/api:apps/mcp_egress_gateway
        run: >-
          pytest -q
          --junitxml=phase13-gateway-regression.xml
          apps/mcp_egress_gateway/tests
      - name: Attach exact-SHA gateway regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase13-gateway-regression-${{ github.sha }}
          path: phase13-gateway-regression.xml
          if-no-files-found: error
          retention-days: 30
      - name: Syntax-check production boundary smoke scripts
        run: sh -n infra/mcp-egress/verify-isolation.sh infra/minio/verify-init.sh
      - name: Exercise the exact MinIO initializer twice against disposable storage
        run: sh infra/minio/verify-init.sh
      - name: Build the isolated release boundaries
        run: |
          docker build -f apps/mcp_egress_gateway/Dockerfile -t geem-mcp-gateway-ci:${GITHUB_SHA} .
          docker build -f infra/mcp-egress/proxy/Dockerfile -t geem-mcp-proxy-ci:${GITHUB_SHA} infra/mcp-egress/proxy

  workspace-web:
    name: Workspace full regression and MCP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_MARKETING_URL: https://geem.ai
    defaults:
      run:
        working-directory: apps/workspace_web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/workspace_web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run the complete Workspace test suite
        run: >-
          npx vitest run
          --reporter=default
          --reporter=junit
          --outputFile=phase13-workspace-regression.xml
      - name: Attach exact-SHA Workspace regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase13-workspace-regression-${{ github.sha }}
          path: apps/workspace_web/phase13-workspace-regression.xml
          if-no-files-found: error
          retention-days: 30
      - run: npm run build

  other-frontends:
    name: Dashboard and marketing regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/dashboard_web/package-lock.json
            apps/landpage_web/package-lock.json
      - name: Install Platform Admin dependencies
        working-directory: apps/dashboard_web
        run: npm ci
      - name: Type-check Platform Admin
        working-directory: apps/dashboard_web
        run: npm run typecheck
      - name: Run the complete Platform Admin test suite
        working-directory: apps/dashboard_web
        run: >-
          npx vitest run
          --reporter=default
          --reporter=junit
          --outputFile=phase13-dashboard-regression.xml
      - name: Attach exact-SHA Platform Admin regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase13-dashboard-regression-${{ github.sha }}
          path: apps/dashboard_web/phase13-dashboard-regression.xml
          if-no-files-found: error
          retention-days: 30
      - name: Build Platform Admin
        working-directory: apps/dashboard_web
        run: npm run build
      - name: Install and verify marketing site
        working-directory: apps/landpage_web
        run: |
          npm ci
          npm run check
          npm run build
          npm run verify
