# Production Cloudflare Tunnel overlay (baked nginx, no Vite reload).
# NEVER run this file on the development Mac — it claims hub.geem.ai /
# api.geem.ai / geem.ai / *.geem.ai and would steal production traffic.
# Run on the production host only.
# Does not replace local geem.dm / localhost DX on a laptop:
#
#   cd infra
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --force-recreate api workspace_web landpage_web cloudflared
#
# Requires infra/cloudflared/credentials.json (see infra/cloudflared/config.yml).
# Development/UAT on this Mac: docker-compose.uat.yml + config.uat.yml.
# Ingress:
#   hub.geem.ai   →  http://workspace_web:80  (production nginx, not Vite)
#   api.geem.ai   →  http://api:8000
#   geem.ai       →  http://landpage_web:80  (production nginx, not Astro dev)
#   mtfm.geem.ai  →  http://dashboard_web:80 (Platform Admin; nginx + /api proxy)
#   *.geem.ai     →  http://workspace_web:80  (tenant hosts; DNS CNAME * → tunnel)

services:
  api:
    environment:
      APP_URL: https://api.geem.ai
      TRUST_PROXY_HEADERS: "true"
      WORKSPACE_WEB_URL: https://hub.geem.ai
    volumes: !reset []
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    environment:
      APP_URL: https://api.geem.ai
      TRUST_PROXY_HEADERS: "true"
      WORKSPACE_WEB_URL: https://hub.geem.ai
    volumes: !reset []

  beat:
    volumes: !reset []

  workspace_web:
    build:
      context: ../apps/workspace_web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://api.geem.ai
        VITE_ROOT_DOMAIN: geem.ai
        VITE_APP_ENV: production
        VITE_MARKETING_URL: https://geem.ai
    environment: !reset {}
    env_file: !reset []
    volumes: !reset []
    ports: !override
      - "5174:80"
    command: ["nginx", "-g", "daemon off;"]

  landpage_web:
    build:
      context: ../apps/landpage_web
      dockerfile: Dockerfile.prod
      args:
        PUBLIC_SITE_URL: https://geem.ai
        PUBLIC_WORKSPACE_URL: https://hub.geem.ai
        PUBLIC_API_BASE_URL: https://api.geem.ai
    environment: !reset {}
    env_file: !reset []
    volumes: !reset []
    ports: !override
      - "4321:80"
    command: ["nginx", "-g", "daemon off;"]

  dashboard_web:
    build:
      context: ../apps/dashboard_web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://mtfm.geem.ai
        VITE_ADMIN_HOST: mtfm.geem.ai
        VITE_APP_ENV: production
    environment: !reset {}
    env_file: !reset []
    volumes: !reset []
    ports: !override
      - "5175:80"
    command: ["nginx", "-g", "daemon off;"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # HTTP/2 is more stable than QUIC on this host (avoids intermittent 502s).
    command: tunnel --protocol http2 --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      api:
        condition: service_started
      workspace_web:
        condition: service_started
      landpage_web:
        condition: service_started
      dashboard_web:
        condition: service_started
