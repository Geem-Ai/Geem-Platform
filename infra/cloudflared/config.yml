# Production Cloudflare Tunnel topology template.
#
# This file deliberately contains no live tunnel identity. The fresh Linux
# deployment procedure creates a new tunnel and installs a rendered copy at
# /etc/geem/cloudflared/config.yml. Never run this template until the marker
# below has been replaced with that new tunnel's exact UUID. Tunnel credentials
# stay outside Git at /etc/geem/cloudflared/credentials.json.
# Development/UAT uses config.uat.yml and credentials-uat.json instead.
tunnel: REPLACE_WITH_NEW_TUNNEL_UUID
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: hub.geem.ai
    service: http://workspace_web:80
    originRequest:
      httpHostHeader: hub.geem.ai
  - hostname: api.geem.ai
    service: http://api:8000
    originRequest:
      httpHostHeader: api.geem.ai
      connectTimeout: 30s
      keepAliveTimeout: 90s
  - hostname: geem.ai
    service: http://landpage_web:80
    originRequest:
      httpHostHeader: geem.ai
  - hostname: www.geem.ai
    service: http://landpage_web:80
    originRequest:
      httpHostHeader: www.geem.ai
  # Platform Admin (APP_ADMIN_HOST) — must be before *.geem.ai
  - hostname: mtfm.geem.ai
    service: http://dashboard_web:80
    originRequest:
      httpHostHeader: mtfm.geem.ai
  # Reserved UAT labels must never fall through the production wildcard when
  # an exact UAT DNS record is absent or temporarily removed.
  - hostname: app-uat.geem.ai
    service: http_status:404
  - hostname: api-uat.geem.ai
    service: http_status:404
  - hostname: landpage-uat.geem.ai
    service: http_status:404
  - hostname: admin-uat.geem.ai
    service: http_status:404
  - hostname: "*.geem.ai"
    service: http://workspace_web:80
  - service: http_status:404
