# Locally-managed Cloudflare Tunnel (UAT).
# Credentials are gitignored: infra/cloudflared/credentials.json
#
# Create / refresh (once, on the host):
#   cloudflared tunnel login
#   cloudflared tunnel create geem-dalseen
#   cp ~/.cloudflared/<TUNNEL-UUID>.json infra/cloudflared/credentials.json
#   cloudflared tunnel route dns geem-dalseen hub.geem.ai
#   cloudflared tunnel route dns geem-dalseen api.geem.ai
#   cloudflared tunnel route dns geem-dalseen geem.ai

# name: geem-dalseen
tunnel: e054f188-97ca-4cab-80da-020f0ae4385b
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: hub.geem.ai
    service: http://workspace_web:80
    originRequest:
      httpHostHeader: hub.geem.ai
  - hostname: api.geem.ai
    service: http://api:8000
    originRequest:
      httpHostHeader: api.geem.ai
      # Chat SSE + large uploads
      connectTimeout: 30s
      keepAliveTimeout: 90s
  - hostname: geem.ai
    service: http://landpage_web:80
    originRequest:
      httpHostHeader: geem.ai
  - hostname: www.geem.ai
    service: http://landpage_web:80
    originRequest:
      httpHostHeader: www.geem.ai
  - service: http_status:404
