# Local full stack (bind-mounts, --reload).
# Production MUST use the reviewed deployment-owned hardening overlay through
# /usr/local/sbin/geem-prod-compose. Base + tunnel alone retains development
# credentials, builds, bind mounts, reload commands, and host ports and is
# forbidden for production. See docs/deployment.md.
# This Mac / UAT (Vite/Astro reload + app-uat / api-uat / landpage-uat / admin-uat):
#   docker compose --env-file ../.env -f docker-compose.yml -f docker-compose.uat.yml up -d --build
# MinIO credentials: MINIO_ACCESS_KEY / MINIO_SECRET_KEY in repo-root ../.env.
# Only those values are passed to MinIO; the application env is not shared.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - application_data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application_broker

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - application_data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        case "$${APP_ENV}" in
          local|dev|development|test)
            export MINIO_ROOT_USER="$${MINIO_ROOT_USER:-minio}"
            export MINIO_ROOT_PASSWORD="$${MINIO_ROOT_PASSWORD:-change-me}"
            ;;
          production)
            if [ -z "$${MINIO_ROOT_USER}" ] || [ "$${MINIO_ROOT_USER}" = "minio" ]; then
              echo "MinIO requires a non-default access key in production" >&2
              exit 1
            fi
            if [ -z "$${MINIO_ROOT_PASSWORD}" ] || [ "$${MINIO_ROOT_PASSWORD}" = "change-me" ]; then
              echo "MinIO requires a non-default secret key in production" >&2
              exit 1
            fi
            ;;
          *)
            echo "MinIO refuses unsupported APP_ENV" >&2
            exit 1
            ;;
        esac
        exec minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9100:9000"
      - "9101:9001"
    networks:
      - application_data

  minio-init:
    # RELEASE.2024-11-21 includes UBI9 coreutils `timeout` and supports both
    # connection deadlines and `mc mb --ignore-existing`. Keep the multi-arch
    # index digest pinned so the watchdog cannot disappear under a mutable tag.
    image: quay.io/minio/mc@sha256:993e8c454a7ec632923f7e3e61adf1d473261da6354cefd641aedd33a2cfe112
    environment:
      APP_ENV: ${APP_ENV:-local}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        case "$${APP_ENV}" in
          local|dev|development|test)
            MINIO_ACCESS_KEY="$${MINIO_ACCESS_KEY:-minio}"
            MINIO_SECRET_KEY="$${MINIO_SECRET_KEY:-change-me}"
            ;;
          production)
            if [ -z "$${MINIO_ACCESS_KEY}" ] || [ "$${MINIO_ACCESS_KEY}" = "minio" ]; then
              echo "MinIO initialization requires a non-default access key in production" >&2
              exit 1
            fi
            if [ -z "$${MINIO_SECRET_KEY}" ] || [ "$${MINIO_SECRET_KEY}" = "change-me" ]; then
              echo "MinIO initialization requires a non-default secret key in production" >&2
              exit 1
            fi
            ;;
          *)
            echo "MinIO initialization refuses unsupported APP_ENV" >&2
            exit 1
            ;;
        esac

        attempts=0
        until timeout -k 2s 5s mc alias set \
          --conn-read-deadline 4s --conn-write-deadline 4s \
          local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" \
          >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          if [ "$${attempts}" -ge 30 ]; then
            echo "MinIO did not become ready before the initialization deadline" >&2
            exit 1
          fi
          sleep 2
        done

        timeout -k 2s 10s mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        timeout -k 2s 10s mc anonymous set none "local/$${MINIO_BUCKET}"
        timeout -k 2s 10s mc stat "local/$${MINIO_BUCKET}" >/dev/null
    networks:
      - application_data

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        API_PYTHON_BASE_IMAGE: ${API_PYTHON_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MCP_EGRESS_GATEWAY_URL: ${MCP_EGRESS_GATEWAY_URL:-https://mcp-egress-gateway:8443}
      MCP_EGRESS_CLIENT_CERT_FILE: /run/secrets/mcp-egress/client.crt
      MCP_EGRESS_CLIENT_KEY_FILE: /run/secrets/mcp-egress/client.key
      MCP_EGRESS_CA_CERT_FILE: /run/secrets/mcp-egress/ca.crt
      HTTP_PROXY: http://app-egress-proxy:3128
      HTTPS_PROXY: http://app-egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,api,postgres,redis,qdrant,minio,mcp-egress-gateway
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
    secrets:
      - source: mcp_egress_client_cert
        target: /run/secrets/mcp-egress/client.crt
      - source: mcp_egress_client_key
        target: /run/secrets/mcp-egress/client.key
        mode: 0400
      - source: mcp_egress_ca_cert
        target: /run/secrets/mcp-egress/ca.crt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      app-egress-proxy:
        condition: service_started
      mail-relay:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Alembic (incl. usage_events partition swap) runs before uvicorn.
      start_period: 180s
    networks:
      - application_data
      - application_broker
      - application_ingress
      - application_provider_control
      - mail_relay_control
      - mcp_egress_control

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        API_PYTHON_BASE_IMAGE: ${API_PYTHON_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MCP_EGRESS_GATEWAY_URL: ${MCP_EGRESS_GATEWAY_URL:-https://mcp-egress-gateway:8443}
      MCP_EGRESS_CLIENT_CERT_FILE: /run/secrets/mcp-egress/client.crt
      MCP_EGRESS_CLIENT_KEY_FILE: /run/secrets/mcp-egress/client.key
      MCP_EGRESS_CA_CERT_FILE: /run/secrets/mcp-egress/ca.crt
      HTTP_PROXY: http://app-egress-proxy:3128
      HTTPS_PROXY: http://app-egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,api,postgres,redis,qdrant,minio,mcp-egress-gateway
    volumes:
      - ../apps/api:/app
    secrets:
      - source: mcp_egress_client_cert
        target: /run/secrets/mcp-egress/client.crt
      - source: mcp_egress_client_key
        target: /run/secrets/mcp-egress/client.key
        mode: 0400
      - source: mcp_egress_ca_cert
        target: /run/secrets/mcp-egress/ca.crt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_started
      api:
        condition: service_healthy
      app-egress-proxy:
        condition: service_started
      mail-relay:
        condition: service_started
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2
    networks:
      - application_data
      - application_broker
      - application_provider_control
      - mail_relay_control
      - mcp_egress_control

  # Datastore-capable services have no direct public route. This proxy exposes
  # only operator-reviewed fixed providers; tenant MCP/OAuth hosts use the
  # separate mTLS gateway and cannot be added at runtime here.
  app-egress-proxy:
    build:
      context: ./app-egress/proxy
      dockerfile: Dockerfile
      args:
        PROXY_UBUNTU_BASE_IMAGE: ${PROXY_UBUNTU_BASE_IMAGE:-ubuntu:24.04}
    restart: unless-stopped
    user: "13:13"
    networks:
      - application_provider_control
      - application_provider_egress
    read_only: true
    tmpfs:
      - /run:size=8m,noexec,nosuid,nodev,uid=13,gid=13,mode=0750
      - /var/log/squid:size=8m,noexec,nosuid,nodev,uid=13,gid=13,mode=0750
      - /var/spool/squid:size=8m,noexec,nosuid,nodev,uid=13,gid=13,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m

  # API/worker cannot submit mail themselves: the fixed-provider proxy carries
  # CONNECT on 443 only. This relay is the single credentialed submission hop,
  # so the mailbox password lives here instead of in the application tier.
  mail-relay:
    build:
      context: ./mail-relay
      dockerfile: Dockerfile
      args:
        PROXY_UBUNTU_BASE_IMAGE: ${PROXY_UBUNTU_BASE_IMAGE:-ubuntu:24.04}
    restart: unless-stopped
    user: "10002:10002"
    environment:
      MAIL_RELAY_UPSTREAM_HOST: ${MAIL_RELAY_UPSTREAM_HOST:-}
      MAIL_RELAY_UPSTREAM_PORT: ${MAIL_RELAY_UPSTREAM_PORT:-587}
      MAIL_RELAY_UPSTREAM_USERNAME: ${MAIL_RELAY_UPSTREAM_USERNAME:-}
      MAIL_RELAY_UPSTREAM_PASSWORD: ${MAIL_RELAY_UPSTREAM_PASSWORD:-}
      MAIL_RELAY_UPSTREAM_FROM: ${MAIL_RELAY_UPSTREAM_FROM:-}
    # Keep the renderer explicit in the rendered Compose model so production
    # validation can detect an overlay that bypasses the fail-closed startup.
    entrypoint: ["python3", "/usr/local/lib/geem/render_mail_relay_config.py"]
    networks:
      - mail_relay_control
      - mail_relay_egress
    read_only: true
    tmpfs:
      - /run:size=8m,noexec,nosuid,nodev,uid=10002,gid=10002,mode=0700
      # msmtp spools every message through libc tmpfile(), which is /tmp only.
      - /tmp:size=8m,noexec,nosuid,nodev,uid=10002,gid=10002,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m

  # Dedicated Beat (Phase 11C/11D). No OTEL collector is required for this stack.
  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        API_PYTHON_BASE_IMAGE: ${API_PYTHON_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      REDIS_URL: redis://redis:6379/0
      # Beat schedules maintenance only. It must never discover or dispatch
      # tenant MCP tools, even when API and worker are enabled in production.
      MCP_CONNECTOR_ENABLED: "false"
    volumes:
      - ../apps/api:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.worker.beat_app:beat_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    # Duplicate schedulers can enqueue the same maintenance job more than once.
    deploy:
      replicas: 1
    networks:
      - application_broker

  workspace_web:
    build:
      context: ../apps/workspace_web
      dockerfile: Dockerfile
    restart: unless-stopped
    # Source of truth: apps/workspace_web/.env (do not override here —
    # Compose `environment` would stomp env_file and force http://api.geem.dm:8000,
    # which breaks HTTPS UAT with mixed-content). Tunnel overlay may set VITE_*.
    env_file:
      - ../apps/workspace_web/.env
    ports:
      - "5174:5174"
    volumes:
      - ../apps/workspace_web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started
    command: npm run dev -- --host 0.0.0.0 --port 5174
    networks:
      - application_ingress

  dashboard_web:
    build:
      context: ../apps/dashboard_web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/dashboard_web/.env
    ports:
      - "5175:5175"
    volumes:
      - ../apps/dashboard_web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started
    command: npm run dev -- --host 0.0.0.0 --port 5175
    networks:
      - application_ingress

  landpage_web:
    build:
      context: ../apps/landpage_web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/landpage_web/.env
    ports:
      - "4321:4321"
    volumes:
      - ../apps/landpage_web:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - application_ingress

  # MCP boundary — the application can reach this mTLS listener only over an
  # internal control network. The gateway is deliberately absent from
  # application_data, receives no ../.env, and has no direct public network.
  mcp-egress-gateway:
    profiles: ["mcp"]
    build:
      context: ..
      dockerfile: apps/mcp_egress_gateway/Dockerfile
      args:
        MCP_GATEWAY_PYTHON_BASE_IMAGE: ${MCP_GATEWAY_PYTHON_BASE_IMAGE:-python:3.12.11-slim-bookworm}
    restart: unless-stopped
    user: "10001:10001"
    environment:
      # Fail-safe default: Compose interpolation does not inherit ../.env.
      # UAT explicitly overrides this to local below.
      APP_ENV: ${MCP_EGRESS_APP_ENV:-production}
      EGRESS_BIND_HOST: 0.0.0.0
      EGRESS_BIND_PORT: 8443
      EGRESS_SERVER_CERT_FILE: /run/secrets/mcp-egress/server.crt
      EGRESS_SERVER_KEY_FILE: /run/secrets/mcp-egress/server.key
      EGRESS_CLIENT_CA_FILE: /run/secrets/mcp-egress/ca.crt
      EGRESS_FORWARD_PROXY_URL: http://mcp-egress-proxy:3128
      EGRESS_ALLOW_PRIVATE: ${MCP_ALLOW_PRIVATE_EGRESS:-false}
      EGRESS_BLOCKED_NETWORKS: ${MCP_EGRESS_BLOCKED_NETWORKS:-}
      EGRESS_SUPPORTED_PROTOCOL_VERSIONS: ${MCP_SUPPORTED_PROTOCOL_VERSIONS:-2026-07-28,2025-11-25,2024-11-05}
      EGRESS_MAX_REDIRECTS: ${MCP_MAX_REDIRECTS:-3}
      EGRESS_MAX_DISCOVERED_TOOLS: ${MCP_MAX_DISCOVERED_TOOLS:-512}
      EGRESS_MAX_TOOL_PAGES: ${MCP_MAX_TOOL_PAGES:-64}
      EGRESS_LEGACY_SESSION_TTL_SECONDS: ${MCP_LEGACY_SESSION_TTL_SECONDS:-300}
      EGRESS_MAX_LEGACY_SESSIONS: ${MCP_MAX_LEGACY_SESSIONS:-64}
      EGRESS_MAX_CONCURRENT_OPERATIONS: ${MCP_MAX_CONCURRENT_OPERATIONS:-128}
      EGRESS_MAX_REQUEST_BYTES: ${MCP_EGRESS_MAX_REQUEST_BYTES:-65536}
      EGRESS_MAX_RESPONSE_BYTES: ${MCP_EGRESS_MAX_RESPONSE_BYTES:-262144}
      EGRESS_CONNECT_TIMEOUT_SECONDS: ${MCP_EGRESS_CONNECT_TIMEOUT_SECONDS:-5}
      EGRESS_READ_TIMEOUT_SECONDS: ${MCP_EGRESS_READ_TIMEOUT_SECONDS:-20}
      EGRESS_TOTAL_TIMEOUT_SECONDS: ${MCP_EGRESS_TOTAL_TIMEOUT_SECONDS:-30}
    secrets:
      - source: mcp_egress_server_cert
        target: /run/secrets/mcp-egress/server.crt
      - source: mcp_egress_server_key
        target: /run/secrets/mcp-egress/server.key
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: mcp_egress_ca_cert
        target: /run/secrets/mcp-egress/ca.crt
    depends_on:
      - mcp-egress-proxy
    networks:
      - mcp_egress_control
      - mcp_proxy_control
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    # Legacy MCP sessions are process-local. Keep one gateway replica unless a
    # later release adds shared session state or proves strict session affinity.
    deploy:
      replicas: 1

  # The only component attached to both the internal proxy-control network and
  # a public-egress network. Squid accepts CONNECT to validated IPs only, denies
  # private/metadata ranges independently, and disables URL/body access logs.
  mcp-egress-proxy:
    profiles: ["mcp"]
    build:
      context: ./mcp-egress/proxy
      dockerfile: Dockerfile
      args:
        PROXY_UBUNTU_BASE_IMAGE: ${PROXY_UBUNTU_BASE_IMAGE:-ubuntu:24.04}
    restart: unless-stopped
    user: "13:13"
    environment:
      # The independent Squid boundary receives the same deployment CIDRs as
      # the Python gateway. Production overlays must require a non-empty set.
      MCP_PROXY_BLOCKED_NETWORKS: ${MCP_EGRESS_BLOCKED_NETWORKS:-}
      MCP_PROXY_REQUIRE_BLOCKED_NETWORKS: ${MCP_PROXY_REQUIRE_BLOCKED_NETWORKS:-false}
    # Keep the renderer explicit in the rendered Compose model so production
    # validation can detect an overlay that bypasses the dynamic deny policy.
    entrypoint: ["python3", "/usr/local/lib/geem/render_mcp_proxy_config.py"]
    networks:
      - mcp_proxy_control
      - mcp_public_egress
    read_only: true
    tmpfs:
      - /run:size=8m,noexec,nosuid,nodev,uid=13,gid=13,mode=0750
      - /var/log/squid:size=8m,noexec,nosuid,nodev,uid=13,gid=13,mode=0750
      - /var/spool/squid:size=8m,noexec,nosuid,nodev,uid=13,gid=13,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:

secrets:
  mcp_egress_ca_cert:
    file: ${MCP_EGRESS_PKI_DIR:-./mcp-egress/pki}/ca/ca.crt
  mcp_egress_server_cert:
    file: ${MCP_EGRESS_PKI_DIR:-./mcp-egress/pki}/server/server.crt
  mcp_egress_server_key:
    file: ${MCP_EGRESS_PKI_DIR:-./mcp-egress/pki}/server/server.key
  mcp_egress_client_cert:
    file: ${MCP_EGRESS_PKI_DIR:-./mcp-egress/pki}/client/client.crt
  mcp_egress_client_key:
    file: ${MCP_EGRESS_PKI_DIR:-./mcp-egress/pki}/client/client.key

networks:
  # Application datastores are reachable only by trusted application services.
  application_data:
    internal: true
  # Redis is isolated from the database/object/vector data plane. API, worker,
  # and the broker-only Beat scheduler are the only application peers.
  application_broker:
    internal: true
  # Ingress/UI traffic is internal; cloudflared bridges it from public_egress.
  application_ingress:
    internal: true
  # API/worker can reach only the fixed-provider proxy on this network.
  application_provider_control:
    internal: true
  # Only the fixed-provider proxy receives this external default route. It is
  # deliberately separate from ingress and the tenant-selected MCP proxy.
  application_provider_egress:
  # API/worker -> mail relay only; no public default route.
  mail_relay_control:
    internal: true
  # Only the mail relay receives this external default route, and it carries
  # authenticated submission traffic only.
  mail_relay_egress:
  # API/worker -> gateway only; no public default route.
  mcp_egress_control:
    internal: true
  # Gateway -> dedicated proxy only; no public default route.
  mcp_proxy_control:
    internal: true
  # Only the MCP proxy receives this external default route.
  mcp_public_egress:
  # Only tunnel ingress attaches to this external default route. Separate
  # egress bridges prevent any public-facing peer from using either proxy.
  public_egress:
