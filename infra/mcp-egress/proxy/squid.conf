# Dedicated MCP gateway proxy. The gateway sends CONNECT to the already
# validated IP, so Squid does not perform a second target DNS lookup.
http_port 3128

acl CONNECT method CONNECT
acl SSL_ports port 443

# The entrypoint renders the tracked, canonical static deny manifest here.
# Static policy text is never accepted from the environment.
# __GEEM_STATIC_BLOCKS__

# The container entrypoint replaces this marker with validated, canonical CIDRs
# from MCP_PROXY_BLOCKED_NETWORKS. Raw environment text is never interpreted as
# Squid syntax.
# __GEEM_DEPLOYMENT_BLOCKS__

http_access deny blocked_destination
http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow all

# No cache, URL/body logs, forwarding identity, or proxy credentials.
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log none
cache_log /dev/null
cache_store_log none
logfile_rotate 0
forwarded_for delete
via off
request_header_access Proxy-Authorization deny all
request_header_access X-Forwarded-For deny all

coredump_dir none
